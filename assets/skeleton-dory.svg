='#1f2328' text-anchor='middle' font-weight='700'>effective depth = 8 + 20 × 4 + 8 = 96 layers = 192 blocks of compute from 4B params</text><text x='500' y='370' font-size='11' fill='#59636e' text-anchor='middle' font-weight='normal'>edits inside the loop get applied 4 times · edit the input stack instead</text></svg>