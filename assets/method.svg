<svg xmlns='http://www.w3.org/2000/svg' width='1000' height='322' viewBox='0 0 1000 322' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'><title>Review method</title><rect x='0.5' y='0.5' width='999' height='321' rx='14' fill='#ffffff' stroke='#d1d9e0'/><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#59636e'/></marker></defs><text x='30' y='38' font-size='20' fill='#1f2328' text-anchor='start' font-weight='700'>How every model was reviewed</text><text x='30' y='60' font-size='13' fill='#59636e' text-anchor='start' font-weight='normal'>Static analysis of the weights only: no prompts, no training. Same pipeline for every model.</text><rect x='30.0' y='82.0' width='138.0' height='62.0' rx='10' fill='#f6f8fa' stroke='#d1d9e0'/><rect x='30.0' y='82.0' width='138.0' height='5.0' rx='2' fill='#8c959f' stroke='none'/><text x='99.0' y='110' font-size='13' fill='#1f2328' text-anchor='middle' font-weight='700'>1 · Open file</text><text x='99.0' y='128' font-size='11' fill='#59636e' text-anchor='middle' font-weight='normal'>GGUF / safetensors</text><line x1='170' y1='113' x2='182' y2='113' stroke='#59636e' stroke-width='1.6' marker-end='url(#ah)'/><rect x='185.0' y='82.0' width='138.0' height='62.0' rx='10' fill='#f6f8fa' stroke='#d1d9e0'/><rect x='185.0' y='82.0' width='138.0' height='5.0' rx='2' fill='#2f6fdf' stroke='none'/><text x='254.0' y='110' font-size='13' fill='#1f2328' text-anchor='middle' font-weight='700'>2 · Group tensors</text><text x='254.0' y='128' font-size='11' fill='#59636e' text-anchor='middle' font-weight='normal'>by stack + layer</text><line x1='325' y1='113' x2='337' y2='113' stroke='#59636e' stroke-width='1.6' marker-end='url(#ah)'/><rect x='340.0' y='82.0' width='138.0' height='62.0' rx='10' fill='#f6f8fa' stroke='#d1d9e0'/><rect x='340.0' y='82.0' width='138.0' height='5.0' rx='2' fill='#1a9e8f' stroke='none'/><text x='409.0' y='110' font-size='13' fill='#1f2328' text-anchor='middle' font-weight='700'>3 · De-quantize</text><text x='409.0' y='128' font-size='11' fill='#59636e' text-anchor='middle' font-weight='normal'>real float weights</text><line x1='480' y1='113' x2='492' y2='113' stroke='#59636e' stroke-width='1.6' marker-end='url(#ah)'/><rect x='495.0' y='82.0' width='138.0' height='62.0' rx='10' fill='#f6f8fa' stroke='#d1d9e0'/><rect x='495.0' y='82.0' width='138.0' height='5.0' rx='2' fill='#8250df' stroke='none'/><text x='564.0' y='110' font-size='13' fill='#1f2328' text-anchor='middle' font-weight='700'>4 · Measure</text><text x='564.0' y='128' font-size='11' fill='#59636e' text-anchor='middle' font-weight='normal'>norm gain · RMS · ΔW</text><line x1='635' y1='113' x2='647' y2='113' stroke='#59636e' stroke-width='1.6' marker-end='url(#ah)'/><rect x='650.0' y='82.0' width='138.0' height='62.0' rx='10' fill='#f6f8fa' stroke='#d1d9e0'/><rect x='650.0' y='82.0' width='138.0' height='5.0' rx='2' fill='#e8590c' stroke='none'/><text x='719.0' y='110' font-size='13' fill='#1f2328' text-anchor='middle' font-weight='700'>5 · Read zones</text><text x='719.0' y='128' font-size='11' fill='#59636e' text-anchor='middle' font-weight='normal'>where numbers shift</text><line x1='790' y1='113' x2='802' y2='113' stroke='#59636e' stroke-width='1.6' marker-end='url(#ah)'/><rect x='805.0' y='82.0' width='138.0' height='62.0' rx='10' fill='#f6f8fa' stroke='#d1d9e0'/><rect x='805.0' y='82.0' width='138.0' height='5.0' rx='2' fill='#1f2328' stroke='none'/><text x='874.0' y='110' font-size='13' fill='#1f2328' text-anchor='middle' font-weight='700'>6 · Review</text><text x='874.0' y='128' font-size='11' fill='#59636e' text-anchor='middle' font-weight='normal'>strengths · edits</text><text x='30' y='178' font-size='15' fill='#1f2328' text-anchor='start' font-weight='700'>What gets measured</text><rect x='30.0' y='187.0' width='6.0' height='18.0' rx='2' fill='#2f6fdf' stroke='none'/><text x='44' y='200' font-size='13' fill='#1f2328' text-anchor='start' font-weight='600'>Norm gain</text><text x='150' y='200' font-size='12' fill='#59636e' text-anchor='start' font-weight='normal'>mean |weight| of each norm vector</text><text x='470' y='200' font-size='12' fill='#1f2328' text-anchor='start' font-weight='normal'>→ how loud a layer lets its input in or out</text><rect x='30.0' y='213.0' width='6.0' height='18.0' rx='2' fill='#1a9e8f' stroke='none'/><text x='44' y='226' font-size='13' fill='#1f2328' text-anchor='start' font-weight='600'>Matrix RMS</text><text x='150' y='226' font-size='12' fill='#59636e' text-anchor='start' font-weight='normal'>RMS of first 256 rows, de-quantized</text><text x='470' y='226' font-size='12' fill='#1f2328' text-anchor='start' font-weight='normal'>→ how strong a projection writes</text><rect x='30.0' y='239.0' width='6.0' height='18.0' rx='2' fill='#8250df' stroke='none'/><text x='44' y='252' font-size='13' fill='#1f2328' text-anchor='start' font-weight='600'>LoRA ΔW</text><text x='150' y='252' font-size='12' fill='#59636e' text-anchor='start' font-weight='normal'>‖B·A·α/r‖ per module + effective rank</text><text x='470' y='252' font-size='12' fill='#1f2328' text-anchor='start' font-weight='normal'>→ where and how richly a fine-tune changed things</text><rect x='30.0' y='265.0' width='6.0' height='18.0' rx='2' fill='#e8590c' stroke='none'/><text x='44' y='278' font-size='13' fill='#1f2328' text-anchor='start' font-weight='600'>Drift</text><text x='150' y='278' font-size='12' fill='#59636e' text-anchor='start' font-weight='normal'>mean relative change of norm gains</text><text x='470' y='278' font-size='12' fill='#1f2328' text-anchor='start' font-weight='normal'>→ how far two models with one skeleton have moved apart</text><text x='30' y='302' font-size='12' fill='#59636e' text-anchor='start' font-weight='normal'>Zones = runs of layers whose numbers move together. Readings are interpretation of weights, not activation probing.</text></svg>