<svg xmlns='http://www.w3.org/2000/svg' width='1000' height='400' viewBox='0 0 1000 400' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'><title>LFM3 family</title><rect x='0.5' y='0.5' width='999' height='399' rx='14' fill='#ffffff' stroke='#d1d9e0'/><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#59636e'/></marker></defs><text x='30' y='38' font-size='20' fill='#1f2328' text-anchor='start' font-weight='700'>LFM3 family: one brain, different senses</text><text x='30' y='60' font-size='13' fill='#59636e' text-anchor='start' font-weight='normal'>Every model below runs the same 24-block LLM. Encoders marked with the same colour are byte-identical.</text><text x='30' y='110' font-size='14' fill='#1f2328' text-anchor='start' font-weight='700'>LFM3-1.7B</text><text x='30' y='126' font-size='11' fill='#59636e' text-anchor='start' font-weight='normal'>text</text><line x1='192' y1='109' x2='540' y2='109' stroke='#59636e' stroke-width='1.6' marker-end='url(#ah)'/><rect x='544.0' y='92.0' width='200.0' height='34.0' rx='8' fill='#f6f8fa' stroke='#1f2328'/><text x='644' y='114' font-size='12' fill='#1f2328' text-anchor='middle' font-weight='600'>LFM3 LLM · 24 blocks</text><text x='30' y='162' font-size='14' fill='#1f2328' text-anchor='start' font-weight='700'>LFM3-VL-2B</text><text x='30' y='178' font-size='11' fill='#59636e' text-anchor='start' font-weight='normal'>text + images</text><rect x='190.0' y='144.0' width='104.0' height='34.0' rx='8' fill='#2f6fdf' stroke='none'/><text x='242' y='166' font-size='12' fill='#ffffff' text-anchor='middle' font-weight='600'>Vision A</text><line x1='304' y1='161' x2='540' y2='161' stroke='#59636e' stroke-width='1.6' marker-end='url(#ah)'/><rect x='544.0' y='144.0' width='200.0' height='34.0' rx='8' fill='#f6f8fa' stroke='#1f2328'/><text x='644' y='166' font-size='12' fill='#1f2328' text-anchor='middle' font-weight='600'>LFM3 LLM 